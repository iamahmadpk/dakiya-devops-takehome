version: "3"

services:
  postgres:
    image: postgres:15-alpine
    container_name: dakiya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-dakiya}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${DB_NAME:-dakiya}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dakiya} -d ${POSTGRES_DB:-dakiya}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dakiya-net

  redis:
    image: redis:7-alpine
    container_name: dakiya-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dakiya-net

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: dakiya-api
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-dakiya}
      DB_USER: ${DB_USER:-dakiya}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      REDIS_HOST: redis
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dakiya-net

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: dakiya-worker
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-dakiya}
      DB_USER: ${DB_USER:-dakiya}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      REDIS_HOST: redis
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dakiya-net


volumes:
  postgres_data:
    name: dakiya_postgres_data
  redis_data:
    name: dakiya_redis_data

networks:
  dakiya-net:
    driver: bridge

