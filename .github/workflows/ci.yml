name: build-test-scan-publish-and-update-staging-gitops

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: iamahmadpk/dakiya-devops-takehome
  IMAGE_NAME_API: ${{ github.repository }}-api
  IMAGE_NAME_WORKER: ${{ github.repository }}-worker
    
jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install pytest

      - name: Run Pytest
        working-directory: ./api
        run: pytest
      
  build-scan-push:
    name: Build, Scan and Push ${{ matrix.service }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: true
      matrix:
        service: [api, worker]
    
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build Image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          load: true
          tags: ${{ matrix.service }}:${{ github.sha }}

      - name: Scan Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.service }}:${{ github.sha }}
          format: table
          exit-code: "0" #change to 1 to to restric image push if vulnerabilities founf
          severity: HIGH,CRITICAL

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest

  update-staging-gitops:
    name: Update staging desired image versions in Git
    needs: [test, build-scan-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/assignment'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the triggering revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Pin staging images to this successful build SHA
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import re

          path = Path("deploy/helm/dakiya/values-staging.yaml")
          text = path.read_text()
          for service in ("api", "worker"):
              pattern = rf'(^  {service}:\n    repository: [^\n]+\n    tag: )"[^"\n]+"'
              text, count = re.subn(pattern, rf'\g<1>"{__import__("os").environ["IMAGE_TAG"]}"', text, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f"Expected exactly one image tag for {service} in {path}; found {count}")
          path.write_text(text)
          PYCODE

      - name: Commit GitOps change (no cluster credentials are used)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/helm/dakiya/values-staging.yaml
          if git diff --cached --quiet; then
            echo "Staging already points at this image SHA; no commit needed."
          else
            git commit -m "gitops(staging): promote images to ${GITHUB_SHA::12}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi