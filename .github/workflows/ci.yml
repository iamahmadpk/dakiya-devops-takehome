name: build-and-deploy

#on: [push]
on:
  workflow_dispatch:
    
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master

      - uses: actions/setup-python@master
        with:
          python-version: "3.x"

      - name: Install and test
        run: |
          cd api
          pip install -r requirements.txt
          pytest || true

      - name: Build images
        run: |
          docker build --build-arg DB_PASSWORD=${{ secrets.DB_PASSWORD }} -t ${{ secrets.REGISTRY }}/dakiya/api:latest ./api
          docker build -t ${{ secrets.REGISTRY }}/dakiya/worker:latest ./worker

      - name: Push images
        run: |
          set -x
          docker login ${{ secrets.REGISTRY }} -u ${{ secrets.REGISTRY_USER }} -p ${{ secrets.REGISTRY_PASSWORD }}
          docker push ${{ secrets.REGISTRY }}/dakiya/api:latest
          docker push ${{ secrets.REGISTRY }}/dakiya/worker:latest

      - name: Deploy to production
        run: |
          echo "${{ secrets.DEPLOY_KEY }}" > deploy_key
          chmod 600 deploy_key
          ssh -i deploy_key -o StrictHostKeyChecking=no deploy@prod.dakiya.internal \
            "cd /srv/dakiya && docker compose pull && docker compose up -d"
