apiVersion: apps/v1
kind: Deployment
metadata:
  name: dakiya-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dakiya-postgres
  template:
    metadata:
      labels:
        app: dakiya-postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.password | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: dakiya-postgres
spec:
  selector:
    app: dakiya-postgres
  ports:
    - port: 5432
