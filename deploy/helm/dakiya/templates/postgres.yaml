apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "dakiya.fullname" . }}-postgres
  labels:
    {{- include "dakiya.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql

spec:
  serviceName: {{ include "dakiya.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "dakiya.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgresql
  template:
    metadata:
      labels:
        {{- include "dakiya.labels" . | nindent 8 }}
        app.kubernetes.io/component: postgresql
    spec:
      # REMOVE or comment out securityContext here if it forces runAsNonRoot/runAsUser for postgres
      containers:
        - name: postgres
          image: "{{ .Values.postgresql.image }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "dakiya.fullname" . }}-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "dakiya.fullname" . }}-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "dakiya.fullname" . }}-secret
                  key: POSTGRES_DB
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: {{ .Values.postgresql.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dakiya.fullname" . }}-postgres
  labels:
    {{- include "dakiya.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    {{- include "dakiya.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql