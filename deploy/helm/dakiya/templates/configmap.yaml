apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dakiya.fullname" . }}-config
  labels:
    {{- include "dakiya.labels" . | nindent 4 }}
data:
  DATABASE_URL: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@{{ include "dakiya.fullname" . }}-postgres:5432/{{ .Values.postgresql.database }}"
  REDIS_URL: "redis://{{ include "dakiya.fullname" . }}-redis:6379/0"