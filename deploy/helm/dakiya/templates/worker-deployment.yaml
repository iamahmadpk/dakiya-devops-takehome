apiVersion: apps/v1
kind: Deployment
metadata:
  name: dakiya-worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app: dakiya-worker
  template:
    metadata:
      labels:
        app: dakiya-worker
    spec:
      containers:
        - name: worker
          image: "{{ .Values.worker.image }}:{{ .Values.worker.tag }}"
          envFrom:
            - configMapRef:
                name: dakiya-config
